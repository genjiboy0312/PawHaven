<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>명랑이 · Idle prototype</title>
<style>body{margin:0;min-height:100vh;display:grid;place-content:center;gap:14px;background:#e7eadf;color:#4c5c49;text-align:center;font:16px system-ui}h1{font-size:22px;margin:0}canvas{width:min(86vw,400px);height:auto;background:#f4f2e7;border-radius:16px;image-rendering:pixelated}button,select{font:inherit;padding:8px 14px;border:1px solid #b9c5ac;border-radius:12px;background:#f4f2e7;color:inherit}p{margin:0}nav{display:flex;justify-content:center;gap:10px}</style>
<h1>명랑이 · Idle prototype</h1><canvas width="400" height="400" aria-label="명랑이 Idle 8프레임 미리보기"></canvas>
<nav><button id="pause">Pause</button><label>FPS <select id="fps"><option>2</option><option selected>4</option><option>6</option><option>8</option></select></label></nav><p id="status">Loading…</p>
<script>
const frames =[{"opaqueBounds":{"bottom":423,"top":20,"left":66,"right":407},"baseline":423,"x":0,"center":236.5,"borderAlphaMax":1,"width":443,"y":0,"height":443},{"opaqueBounds":{"bottom":423,"top":19,"left":38,"right":381},"baseline":423,"x":443,"center":209.5,"borderAlphaMax":1,"width":444,"y":0,"height":443},{"opaqueBounds":{"bottom":424,"top":10,"left":26,"right":376},"baseline":424,"x":887,"center":201,"borderAlphaMax":2,"width":443,"y":0,"height":443},{"opaqueBounds":{"bottom":423,"top":20,"left":31,"right":377},"baseline":423,"x":1330,"center":204,"borderAlphaMax":1,"width":444,"y":0,"height":443},{"opaqueBounds":{"bottom":418,"top":12,"left":65,"right":409},"baseline":418,"x":0,"center":237,"borderAlphaMax":1,"width":443,"y":443,"height":444},{"opaqueBounds":{"bottom":418,"top":10,"left":38,"right":385},"baseline":418,"x":443,"center":211.5,"borderAlphaMax":1,"width":444,"y":443,"height":444},{"opaqueBounds":{"bottom":418,"top":7,"left":34,"right":379},"baseline":418,"x":887,"center":206.5,"borderAlphaMax":2,"width":443,"y":443,"height":444},{"opaqueBounds":{"bottom":418,"top":7,"left":31,"right":377},"baseline":418,"x":1330,"center":204,"borderAlphaMax":1,"width":444,"y":443,"height":444}];
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),image=new Image(),status=document.querySelector('#status');
let playing=true,frame=0,last=0;
const scale=Math.min(300/Math.max(...frames.map(f=>f.opaqueBounds.bottom-f.opaqueBounds.top)),330/Math.max(...frames.map(f=>f.opaqueBounds.right-f.opaqueBounds.left)));
function draw(){const f=frames[frame];ctx.clearRect(0,0,400,400);ctx.imageSmoothingEnabled=false;ctx.drawImage(image,f.x,f.y,f.width,f.height,200-f.center*scale,350-f.baseline*scale,f.width*scale,f.height*scale);status.textContent=`Idle · ${frame+1} / 8`;}
image.onload=()=>{draw();requestAnimationFrame(tick);};image.onerror=()=>{status.textContent='PNG 파일을 같은 폴더에 두고 다시 열어주세요.';};
function tick(now){if(playing&&now-last>=1000/Number(document.querySelector('#fps').value)){frame=(frame+1)%frames.length;last=now;draw();}requestAnimationFrame(tick);}
document.querySelector('#pause').onclick=()=>{playing=!playing;document.querySelector('#pause').textContent=playing?'Pause':'Play';last=performance.now();};
image.src='Myeongrang_Idle_Prototype.png';
</script></html>
