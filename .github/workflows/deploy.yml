name: Deploy Paw Haven

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      release_files: ${{ steps.release.outputs.files }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20.20.2'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          for file in tests/*.test.mjs; do
            echo "Testing $file"
            timeout --kill-after=10s 120s node --test "$file" 2>&1 | tee -a test-results.log
          done
      - name: Preserve test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: test-results.log
      - name: Typecheck and build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_SUPABASE_URL: https://rgsbqfjnhdvmqxrlqawm.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable__tjTdqyp80AH5UCWR9QcLA_PHXbX3Sz
        run: npm run build
      - name: Install Chromium for purchase check
        run: npx playwright install --with-deps chromium
      - name: Verify guest purchase and reload
        shell: bash
        env:
          PAGES_URL: http://127.0.0.1:4173/
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 "$PAGES_URL" > /dev/null
          node scripts/check-pages-startup.mjs purchase
      - name: Preserve purchase check diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-purchase-failure
          path: |
            smoke-diagnostics/
            preview.log
          if-no-files-found: ignore
      - name: Record startup file hashes
        id: release
        shell: bash
        run: |
          files="$(node scripts/check-pages-build.mjs record)"
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Checkout verification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify live build
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_FILES: ${{ needs.build.outputs.release_files }}
        run: node scripts/check-pages-build.mjs verify


  smoke:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20.20.2'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start game as guest
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/check-pages-startup.mjs
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-failure
          path: smoke-diagnostics/
          if-no-files-found: ignore
