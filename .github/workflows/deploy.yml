name: Deploy Paw Haven

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20.20.2'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          for file in tests/*.test.mjs; do
            echo "Testing $file"
            timeout 120s node --test "$file" 2>&1 | tee -a test-results.log
          done
      - name: Preserve test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: test-results.log
      - name: Typecheck and build
        env:
          VITE_SUPABASE_URL: https://rgsbqfjnhdvmqxrlqawm.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable__tjTdqyp80AH5UCWR9QcLA_PHXbX3Sz
        run: npm run build
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
